interface:
  display_name: "投委会议题"
  short_description: "撰写会议表决、项目投资、基金组建、项目退出、采购等议题，书面公文口吻、硬逻辑，生成公文排版DOCX"
  default_prompt: "Use $yiti-skill to draft a 议题. First decide the type: A 会议参会表决, B 项目退出, C 项目投资, D 基金组建, E 采购等经营事项, and follow its fixed skeleton in SKILL.md. Answer the six questions (请什么、为什么办、凭什么办、怎么办、对我方意味着什么、还差什么) before writing. Write only 事实句、依据句、判断句、请求句 in formal officialese: 主语用我司/我方, 段首用定位词, 判断紧跟依据, 每段落在事实或结论上. Keep one reasoning chain from 导语 to 请示事项, make every number reconcile, add thousands separators (1,980万元), run the text checker, and render with page footer '- 1 -'."
