interface:
  display_name: "国企股权投资投后报告"
  short_description: "依据随调用提供的投后材料填充国企股权投资投后报告并生成正式DOCX"
  default_prompt: "使用 $soe-post-investment-report，根据随本次请求提供的投后材料，填充并更新中文国企股权投资项目投后情况报告。首先严格提出四项变更确认问题，材料在首轮不读取；得到答复后保持正文固定框架（含按项目分设的多个SPV位置）和来源派生版式，逐项核对重要事实与日期勾稽，以正式国企书面上行文口吻成文，将正文控制在规定页数内，并输出可直接使用的DOCX。"
